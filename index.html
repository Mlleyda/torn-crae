<script>
/* =====================================================================
   CONFIGURACIÓ DELS DOS GOOGLE SHEETS
   ---------------------------------------------------------------------
   Deixa en blanc per veure les dades d'exemple. Quan hi posis els enllaços,
   l'app llegirà (i desarà) les dades reals.

   OPCIÓ RECOMANADA: Google Apps Script desplegat com a "Aplicació web"
   (Executa com: tu · Accés: qualsevol amb l'enllaç). Permet llegir i desar.
   Enganxa'n l'URL acabada en /exec.

   OPCIÓ NOMÉS LECTURA: Fitxer > Compartir > Publicar a la web > CSV de cada pestanya.
   Amb CSV les modificacions no es desen al full.
   ===================================================================== */
const CONFIG = {
  // FULL 1 (Feina): conté la pestanya de rutines i la d'agenda de feina
  FEINA_URL: "",            // <-- URL /exec d'Apps Script del full de FEINA
  FEINA_CSV_RUTINES: "",    // <-- (opcional) URL CSV de la pestanya de rutines
  FEINA_CSV_AGENDA: "",     // <-- (opcional) URL CSV de la pestanya d'agenda de feina

  // FULL 2 (Família): agenda de família
  FAMILIA_URL: "",          // <-- URL /exec d'Apps Script del full FAMÍLIA
  FAMILIA_CSV: "",          // <-- (opcional) URL CSV de la pestanya d'agenda de família

  // FULL 3 (Personal): agenda personal. Deixa-ho en blanc fins que el tinguis creat.
  PERSONAL_URL: "",         // <-- URL /exec d'Apps Script del full PERSONAL
  PERSONAL_CSV: "",         // <-- (opcional) URL CSV de la pestanya d'agenda personal

  // Noms exactes de les pestanyes dins de cada fitxer
  PESTANYA_RUTINES: "Rutines fixes",   // al full de Feina
  PESTANYA_FEINA: "Gestió",            // al full de Feina (agenda de feina)
  PESTANYA_FAMILIA: "Família",         // al full Família (agenda de família)
  PESTANYA_PERSONAL: "Personal",       // al full Personal (agenda personal)

  // Un seguiment obert des de fa aquests dies o més surt als avisos
  SEGUIMENT_AVIS_DIES: 7,

  /* DIES NO ESCOLARS = caps de setmana + festius + vacances d'estiu i de Nadal.
     L'app ho calcula sola cada dia i et deixa canviar-ho amb el commutador. */
  FESTIUS: ['01-01','01-06','05-01','06-24','08-15','09-11','10-12','11-01','12-06','12-08','12-25','12-26'], // MM-DD
  // El Divendres Sant i el Dilluns de Pasqua es calculen sols.
  FESTIUS_EXTRA: [],   // <-- festius locals o de lliure disposició: 'AAAA-MM-DD'
  VACANCES: [          // <-- ajusta-ho al calendari escolar de la teva zona (MM-DD, inclosos)
    { nom: "Vacances de Nadal", des: '12-23', fins: '01-07' },
    { nom: "Vacances d'estiu", des: '06-22', fins: '09-10' }
  ]
};

/* Els URL també es poden guardar dins del dispositiu (botó "Fulls" de dalt a la dreta)
   o amb un enllaç de configuració (#cfg=...). Així el fitxer que es penja no porta cap URL. */
(function () {
  const ok = v => typeof v === 'string' && /^https:\/\/script\.google\.com\/macros\//.test(v);
  try {
    const m = location.hash.match(/^#cfg=([A-Za-z0-9_-]+)/);
    if (m) {
      const j = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
      const cfg = {};
      if (ok(j.f)) cfg.FEINA_URL = j.f;
      if (ok(j.a)) cfg.FAMILIA_URL = j.a;
      if (ok(j.p)) cfg.PERSONAL_URL = j.p;
      localStorage.setItem('crae.cfg', JSON.stringify(cfg));
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) {}
  try {
    const saved = JSON.parse(localStorage.getItem('crae.cfg') || '{}');
    ['FEINA_URL', 'FAMILIA_URL', 'PERSONAL_URL'].forEach(k => { if (!CONFIG[k] && ok(saved[k])) CONFIG[k] = saved[k]; });
  } catch (e) {}
})();

/* CAPÇALERES (fila 1) que han de tenir les pestanyes:

                       o un o més dies de la setmana ("Dilluns", "Dimarts, Dijous"...)
     Col. B franja:    "Inici de torn" · "Matí" · "Tarda" · "Nit" · "Fi de torn"
                       (també s'entén "Inici torn" i "Fi torn", sense accents ni majúscules)

     ESTRUCTURA DE TORNS (l'app ho aplica sola, a més del que posis a la col. A):
       Dia escolar     -> torns Matí, Tarda i Nit.
                          Matí i Tarda inclouen també les rutines d'"Inici de torn" i "Fi de torn".
                          Nit només mostra les rutines de "Nit".
       Dia NO escolar  -> torns Dia i Nit (cap de setmana, festiu o vacances).
                          El torn Dia inclou les rutines de franja Matí i Tarda (les que toquen al dia:
                          "Dies no escolars", "Dissabte", "Diumenge", "Tots els dies"...),
                          més "Inici de torn" i "Fi de torn". No cal cap franja "Dia" al full.
     Les rutines de col. A "Dies escolars" no surten mai en dia no escolar, i les de "Dies no escolars" no surten mai en dia escolar.

   Agenda de Feina (pestanya "Gestió"), de Família (pestanya "Família") i Personal (pestanya "Personal"),
   MATEIXES capçaleres als tres fulls:
     data_registre | persona_registra | tipus | qui | titol | explicacio | data | hora | responsable | estat | id | prioritat

     data_registre:    dia en què es va apuntar la nota (l'app l'omple sola en crear-la)
     persona_registra: qui crea o escriu la nota
     tipus (col. C):   desplegable "Agenda" · "Tasca" · "Seguiment"
     qui:              usuari/a a qui afecta la gestió (EFA, ECC, DRV, NR, FXX, AXX...) o "Llar" si afecta tota la llar
     titol:            nom curt de la gestió
     explicacio:       detall o notes de la gestió
     data:             Agenda = dia de l'esdeveniment · Tasca = data límit
                       Seguiment = dia que es va obrir (no té data de fi)
     hora:             format 24 h (Format > Número > Format personalitzat > HH:mm)
     responsable:      qui s'encarrega d'executar-la (no és qui l'ha apuntat)
     estat:            Pendent · Fet · Cancel·lada (un seguiment tancat = Fet)
     id:               l'omple l'app; si escrius una fila a mà, el script li posa un id sol
     prioritat (col. L): desplegable Alta · Mitjana · Baixa (opcional). NO la posis a la columna de l'id.

   CODI D'APPS SCRIPT (Extensions > Apps Script a cada full; mateix codi als tres).
   Llegeix i desa pel NOM de la capçalera, així que serveix per a totes les pestanyes.

   function doGet(e) {

     }
     return ContentService.createTextOutput(JSON.stringify({rows}))

   }
   function doPost(e) {

       const line = h.map(k => d.row[k] === undefined ? '' : d.row[k]);
       const i = v.findIndex((r, j) => j > 0 && String(r[c]) === String(d.row.id));
       if (i > 0) sh.getRange(i + 1, 1, 1, h.length).setValues([line]); else sh.appendRow(line);
     } finally { lock.releaseLock(); }

*/

/* ---------- Utilitats ---------- */
const DIES = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
const MESOS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const MES_C = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
const FRANGES = ['Inici de torn','Matí','Dia','Tarda','Nit','Fi de torn'];
const TORNS = ['Matí','Tarda','Nit','Dia','Tots'];
/* Franges que mostra cada torn (el torn "Tots" mostra totes les del tipus de dia) */
const FRANJES_PER_TORN = {
  'Matí':  ['Inici de torn','Matí','Fi de torn'],
  'Tarda': ['Inici de torn','Tarda','Fi de torn'],
  'Dia':   ['Inici de torn','Matí','Dia','Tarda','Fi de torn'],   /* el torn Dia inclou el matí i la tarda */
  'Nit':   ['Nit']
};
/* Franges que existeixen segons el tipus de dia */
const FRANJES_DIA = {
  escolar:   ['Inici de torn','Matí','Tarda','Nit','Fi de torn'],
  noescolar: ['Inici de torn','Matí','Dia','Tarda','Nit','Fi de torn']
};
const tornsDisponibles = () => S.escola ? ['Matí','Tarda','Nit','Tots'] : ['Dia','Nit','Tots'];
/* Si el torn triat no existeix en aquest tipus de dia, passa al seu equivalent */
function ajustaTorn() {
  const ok = tornsDisponibles();
  if (ok.includes(S.torn)) return;
  S.torn = (S.torn === 'Matí' || S.torn === 'Tarda') ? 'Dia' : S.torn === 'Dia' ? 'Matí' : ok[0];
}
const WDAYS = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte']; /* = Date.getDay() */
const PRIOS = ['Alta','Mitjana','Baixa'];
const QUIS_EXEMPLE = ['Llar','EFA','ECC','DRV','NR','FXX','AXX'];
const TIPUS = ['Agenda','Tasca','Seguiment'];
const TIPUS_TITOL = { Agenda: 'Agenda', Tasca: 'Tasques', Seguiment: 'Seguiments' };
const EST = ['Pendent','Fet','Cancel·lada'];
const ORIGEN = { feina: 'Feina', familia: 'Família', personal: 'Personal' };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const T = () => iso(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00')) / 864e5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dISO(v) {
  if (!v) return '';
  const s = String(v);
  if (/T/.test(s)) { const d = new Date(s); return isNaN(d) ? '' : iso(d); }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : '';
}
function dHM(v) {
  if (!v) return '';
  const s = String(v);
  if (/T/.test(s)) { const d = new Date(s); return isNaN(d) ? '' : `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : '';
}

  const n = diff(d, T());
  if (n === 0) return 'avui';

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const [h, ...b] = rows;
  return b.filter(r => r.some(x => x)).map(r => Object.fromEntries(h.map((k, i) => [k, r[i] ?? ''])));
}

function pasqua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
const enRang = (md, a, b) => a <= b ? (md >= a && md <= b) : (md >= a || md <= b);
/* Retorna el motiu pel qual el dia no és escolar, o '' si és un dia d'escola. */
function motiuNoEscolar(d = new Date()) {
  if (d.getDay() === 0 || d.getDay() === 6) return 'Cap de setmana';
  const full = iso(d), md = full.slice(5);
  const p = pasqua(d.getFullYear()), dv = new Date(p), dl = new Date(p);
  dv.setDate(p.getDate() - 2); dl.setDate(p.getDate() + 1);
  if (CONFIG.FESTIUS.includes(md) || CONFIG.FESTIUS_EXTRA.includes(full) || full === iso(dv) || full === iso(dl)) return 'Festiu';
  const v = CONFIG.VACANCES.find(x => enRang(md, x.des, x.fins));
  return v ? v.nom : '';
}

async function fetchTable(app, sheet, csv) {
  if (app) {
    const r = await fetch(`${app}${app.includes('?') ? '&' : '?'}sheet=${encodeURIComponent(sheet)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) {
      throw new Error(/getDataRange|TypeError/.test(txt) ? `No troba la pestanya "${sheet}"` : "Resposta no vàlida. Comprova que la implementació tingui accés per a qualsevol persona");
    }
    if (j.error) throw new Error(String(j.error));
    return (j.rows || j).map(normRow);
  }
  if (csv) {
    const r = await fetch(csv);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return parseCSV(await r.text()).map(normRow);
  }
  return null;
}

function parseDia(v) {
  const k = norm(v);
  if (k === '' || ['tots_els_dies', 'tots_el_dies', 'tots_dies', 'tots', 'diari', 'cada_dia'].includes(k)) return { t: 'tots' };
  if (['dies_escolars', 'dia_escolar', 'dies_d_escola', 'dia_d_escola', 'escolar', 'escolars'].includes(k)) return { t: 'escolar' };
  if (['dies_no_escolars', 'dia_no_escolar', 'dies_sense_escola', 'no_escolar', 'no_escolars'].includes(k)) return { t: 'noescolar' };
  const dies = k.split('_').filter(x => x !== 'i');
  if (dies.length && dies.every(x => WDAYS.includes(x))) return { t: 'dies', dies };
  return null;
}

    const n = x.data ? diff(x.data, t) : null;
    if (x.tipus === 'Tasca') {
      if (n !== null && n < 0) out.push({ lvl: 0, kind: 'bad', tag: 'Vençuda', title: x.titol, meta: `${o} · ${relDay(x.data)}` });
      else if (n === 0) out.push({ lvl: 1, kind: 'warn', tag: 'Per avui', title: x.titol, meta: o });
      else if (x.prioritat === 'Alta' && n !== null && n <= 2) out.push({ lvl: 2, kind: 'warn', tag: 'Prioritat alta', title: x.titol, meta: `${o} · ${relDay(x.data)}` });
    } else if (x.tipus === 'Agenda') {
      if (n !== null && n < 0) out.push({ lvl: 0, kind: 'bad', tag: 'Sense tancar', title: x.titol, meta: `${o} · ${relDay(x.data)}` });
      else if (n === 0) out.push({ lvl: 1, kind: 'info', tag: 'Agenda avui', title: x.titol, meta: `${o}${x.hora ? ' · ' + x.hora : ''}` });
    } else if (n !== null && -n >= CONFIG.SEGUIMENT_AVIS_DIES) {
      out.push({ lvl: 2, kind: 'warn', tag: 'Seguiment obert', title: x.titol, meta: `${o} · obert ${relDay(x.data)}` });
    }
  });
  return out.sort((a, b) => a.lvl - b.lvl);
}
function dataMeta(x) {
  const t = T(), pend = x.estat === 'Pendent';
  if (!x.data) return { txt: x.tipus === 'Seguiment' ? 'Obert, sense data' : 'Sense data', cls: '' };
  const n = diff(x.data, t);
  if (x.tipus === 'Agenda') {
    const past = pend && n < 0;
    return { txt: `${dShort(x.data)}${x.hora ? ' · ' + x.hora : ''} (${relDay(x.data)})${past ? ' · sense tancar' : ''}`, cls: past ? 'bad' : (pend && n === 0 ? 'warn' : '') };
  }
  if (x.tipus === 'Tasca') return { txt: `Límit ${dShort(x.data)} (${relDay(x.data)})`, cls: pend && n < 0 ? 'bad' : (pend && n === 0 ? 'warn' : '') };
  return { txt: `Obert des del ${dShort(x.data)} (${relDay(x.data)})`, cls: pend && -n >= CONFIG.SEGUIMENT_AVIS_DIES ? 'warn' : '' };
}

function ring(p) {
  const c = 2 * Math.PI * 34;
  return `<svg viewBox="0 0 80 80" width="92" height="92" role="img" aria-label="${Math.round(p*100)}% de rutines fetes">
    <circle cx="40" cy="40" r="34" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 40 40)"/>
  </svg>`;
}

function rutRow(r, off) {
  const d = isDone(r), pd = parseDia(r.tipus_dia);
  const tags = [];
  if (!pd) tags.push(['warn', `Tipus de dia no reconegut: «${r.tipus_dia}»`]);
  else if (pd.t !== 'tots' && !(pd.t === 'escolar' && ['Matí','Tarda'].includes(franjaDe(r))) && !(pd.t === 'noescolar' && franjaDe(r) === 'Dia')) tags.push(['', r.tipus_dia]);
  if (!franjaDe(r)) tags.push(['warn', `Franja no reconeguda: «${r.franja}»`]);
  return `<button class="rut ${d ? 'done' : ''}" role="checkbox" aria-checked="${d}" data-act="rut" data-id="${esc(r.id)}" ${off ? 'disabled' : ''}>
    <span class="chk">${d ? ic('check', 15) : ''}</span>
    <span class="min-w-0"><span class="t">${esc(r.rutina)}</span>${tags.map(([c, t]) => `<span class="tag ${c}">${esc(t)}</span>`).join(' ')}</span>
  </button>`;
}

    h += `<section class="card flex items-center gap-4">

        <p class="meta">${pend ? `${pend} pendents` : 'Tot fet. Bon relleu!'} · ${oberts} elements oberts a l'agenda</p>
      </div>

  } else {
    h += `<section class="card rest">
      <p class="label">Descans</p>
      <p class="display text-2xl font-bold mt-2">Avui no estàs de torn</p>
      <p class="meta">Les rutines queden en pausa. Per quan tornis: ${oberts} elements oberts a l'agenda i ${avui} cites previstes avui.</p>

    </section>`;
  }
  h += `<section class="card">
    <div class="flex items-center justify-between gap-2"><h2 class="text-lg font-bold">Avisos prioritaris</h2><span class="pill ${av.length ? 'warn' : 'ok'}">${av.length || 'Cap'}</span></div>
    ${av.length ? `<ul class="list mt-1">${av.map(a => `

function viewAgenda() {

  const list = base.filter(x => x.estat === S.fEst);
  const labels = { 'Pendent': 'Pendents', 'Fet': 'Fet', 'Cancel·lada': 'Cancel·lades' };
  const asc = S.fEst === 'Pendent';

  if (!any && !sense) h += `<section class="card"><p class="meta" style="margin:0">No hi ha res amb aquests filtres.</p></section>`;
  return h;
}

  const camp = (id, nm, label) => `<div class="field"><label class="label" for="${id}">${label}</label>
    <input id="${id}" name="${nm}" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(CONFIG[nm])}" placeholder="https://script.google.com/macros/s/.../exec"></div>`;
  openSheet(`<form data-form="fulls" class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">Connexió amb els fulls</h2>
    <ul class="list">${[['rutines', 'Rutines fixes (Feina)'], ['feina', 'Gestió (Feina)'], ['familia', 'Família'], ['personal', 'Personal']].map(([k, n]) => estatFull(k, n)).join('')}</ul>
    <p class="meta" style="margin:0">Enganxa l'URL de cada full (acaba en /exec). Es guarda només en aquest dispositiu.</p>
    ${camp('f_u1', 'FEINA_URL', 'Full de Feina')}
    ${camp('f_u2', 'FAMILIA_URL', 'Full de Família')}
    ${camp('f_u3', 'PERSONAL_URL', 'Full Personal')}
    <div class="flex gap-2 justify-end flex-wrap"><button type="button" class="btn" data-act="refreshf">Actualitzar</button><button type="button" class="btn" data-act="sheetx">Tancar</button><button class="btn primary" type="submit">Desar</button></div>
  </form>`);
}
function formJo() {
  openSheet(`<form data-form="jo" class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">Qui ets?</h2>
    <p class="meta" style="margin:0">S'usa per omplir "qui ho apunta" i per filtrar les tasques de les quals ets responsable.</p>
    <div class="field"><label class="label" for="f_jo">El teu nom</label><input id="f_jo" name="jo" value="${esc(S.jo)}" required></div>
    <div class="flex gap-2 justify-end"><button type="button" class="btn" data-act="sheetx">Cancel·lar</button><button class="btn primary" type="submit">Desar</button></div>
  </form>`);
}

/* ---------- Esdeveniments ---------- */
const ACT = {
  torn: (id, v) => { S.torn = v; LS.set('torn', v); renderAll(); },
  estat: () => { S.treballant = !S.treballant; LS.set('treballant', S.treballant); renderAll(); },
  escola: () => { S.escola = !S.escola; LS.set('escola', { d: T(), v: S.escola }); ajustaTorn(); renderAll(); },
  tab: (id, v) => { S.tab = v; renderAll(); window.scrollTo(0, 0); },
  refresh: () => loadAll(),
  fulls: () => formFulls(),
  refreshf: () => { closeSheet(); loadAll().then(formFulls); },
  rut: id => { const r = S.rutines.find(x => x.id === id); if (!r) return; r.fet_el = isDone(r) ? '' : T(); renderAll(); persist('rutines', r); },
  fest: (id, v) => { S.fEst = v; renderView(); },
  fori: (id, v) => { S.fOri = v; renderView(); },
  itstate: (key, v) => { const x = findItem(key); if (!x) return; x.estat = v; renderAll(); persist(x._k, x); },
  nota: key => formNota(key),
  jo: () => formJo(),
  meves: () => { if (!S.jo && !S.fMeves) return formJo(); S.fMeves = !S.fMeves; renderView(); },
  newitem: formItem,
  sheetx: (id, v, el, ev) => { if (ev.target === el) closeSheet(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'sheetx' && b.classList.contains('scrim') && e.target !== b) return;
  ACT[b.dataset.act]?.(b.dataset.id, b.dataset.v, b, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (f.dataset.form === 'item') {
    const kind = ORIGENS.includes(d.origen) ? d.origen : 'feina';
    const x = mapItem(kind)({ id: uid(), data_registre: T(), persona_registra: d.persona_registra.trim(), tipus: d.tipus, qui: d.qui.trim(),
      titol: d.titol.trim(), explicacio: d.explicacio, data: d.tipus === 'Seguiment' ? d.data : (d.data || T()), hora: d.hora,
      responsable: d.responsable.trim(), prioritat: d.prioritat, estat: 'Pendent' });
    S[kind].push(x); S.fEst = 'Pendent';
    if (d.persona_registra.trim() && !S.jo) { S.jo = d.persona_registra.trim(); LS.set('jo', S.jo); }
    persist(kind, x);
  } else if (f.dataset.form === 'nota') {
    const x = findItem(f.dataset.id);
    if (x) { x.explicacio = d.explicacio || ''; x.responsable = (d.responsable || '').trim(); persist(x._k, x); }
  } else if (f.dataset.form === 'jo') {
    S.jo = d.jo.trim(); LS.set('jo', S.jo);
  }
  if (f.dataset.form === 'fulls') {
    const cfg = {};
    ['FEINA_URL', 'FAMILIA_URL', 'PERSONAL_URL'].forEach(k => { const v = (d[k] || '').trim(); if (/^https:\/\/script\.google\.com\/macros\//.test(v)) cfg[k] = v; });
    try { localStorage.setItem('crae.cfg', JSON.stringify(cfg)); } catch (e) {}
    closeSheet();
    try { location.reload(); } catch (e) { renderAll(); }
    return;
  }
  closeSheet(); renderAll();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el && el.dataset.chg === 'fqui') { S.fQui = el.value; renderView(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

renderAll();
loadAll();
</script>
</body>
</html>
